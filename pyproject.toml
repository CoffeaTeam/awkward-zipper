[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awkward-zipper"
description = "Transform awkward arrays into HEP-friendly datastructures"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "awkward >=2.8.8",
    "vector",
    "numba",
    # particle masses for the ATLAS ntuple schema's synthesized `mass` fields
    "particle",
    # the vendored EDM4HEP data-model yaml files
    "pyyaml",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/CoffeaTeam/awkward-zipper"
Documentation = "https://coffeateam.github.io/awkward-zipper/"
Source = "https://github.com/CoffeaTeam/awkward-zipper"
Issues = "https://github.com/CoffeaTeam/awkward-zipper/issues"

[dependency-groups]
test = ["pytest >=7", "pytest-cov >=3"]
dev = [
    { include-group = "test" },
    "ipython",
    "ruff",
    "pre_commit",
    "mypy",
    "coffea",
    # reference implementation for the ATLAS ntuple schema (external to coffea)
    "atlas-schema",
    # use the version of uproot that supports virtual arrays
    "uproot",
    "requests",
    "aiohttp",
]


[tool.hatch]
version.path = "src/awkward_zipper/__init__.py"
metadata.allow-direct-references = true

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
strict = false
ignore_missing_imports = true

[tool.ruff.lint]
ignore = [
    "PLR",  # Design related pylint codes
    "E501", # Line too long
    # "B006",   # converts default args to 'None'
    "I002",   # isort: "from __future__ import annotations"
    "ISC001", # flake8-implicit-str-concat: Implicit string concatenation"
    "PLC0415", # `import` should be at the top-level of a file
    "RUF059",  # Unpacked variable is never used
]
select = [
    "E",
    "F",
    "W",   # flake8
    "B",   # flake8-bugbear
    "I",   # isort
    "C4",  # flake8-comprehensions
    "EM",  # flake8-errmsg
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "G",   # flake8-logging-format
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "EXE", # flake8-executable
]
unfixable = [
    "F841", # Would remove unused variables
]
flake8-unused-arguments.ignore-variadic-names = true
isort.required-imports = ["from __future__ import annotations"]
